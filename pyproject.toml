[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquarium-controller"
version = "0.1.0"
description = "Aquarium controller: pH / TDS / temperature sensing, control loops, alerts and a live dashboard"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hardware = ["pyserial>=3.5", "smbus2>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
aqctl = "aquarium.cli:main"

[tool.setuptools.packages.find]
include = ["aquarium*"]

[tool.setuptools.package-data]
aquarium = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
